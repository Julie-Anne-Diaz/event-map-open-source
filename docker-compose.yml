services:

  db:
    image: postgres:16-alpine
    container_name: vidamobile-db

    environment:
      POSTGRES_DB: event_map
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_map"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./api

    container_name: vidamobile-api

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/event_map
      SECRET_KEY: local-development-secret-key-change-me

    expose:
      - "8010"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

      args:
        NEXT_PUBLIC_API_BASE_URL: /api

    container_name: vidamobile-frontend

    expose:
      - "3000"

    depends_on:
      - api


  proxy:
    image: nginx:alpine

    container_name: vidamobile-proxy

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - api


volumes:
  postgres_data: